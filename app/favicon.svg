<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Círculo Azul de Fundo -->
  <circle cx="32" cy="32" r="30" fill="#2563EB" />
  
  <!-- Ícone de Lápis com Borracha -->
  <g transform="rotate(-45 32 32)">
    <!-- Corpo principal do lápis (amarelo) -->
    <rect x="28" y="14" width="8" height="28" fill="#FACC15" rx="1" />
    
    <!-- Ponta do lápis (grafite) -->
    <polygon points="28,42 36,42 32,48" fill="#1E293B" />
    <polygon points="29,42 35,42 32,45" fill="#FDE047" />

    <!-- Borracha na ponta superior -->
    <rect x="28" y="10" width="8" height="6" fill="#F43F5E" rx="1" />
    <!-- Cinta metálica da borracha -->
    <rect x="28" y="16" width="8" height="3" fill="#94A3B8" />
  </g>
</svg>
