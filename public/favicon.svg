<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Círculo Azul de Fundo -->
  <circle cx="32" cy="32" r="30" fill="#2563EB" />
  
  <!-- Ícone de Lápis com Borracha Maior -->
  <g transform="rotate(-45 32 32)">
    <!-- Corpo principal do lápis (amarelo) - Alongado -->
    <rect x="27" y="10" width="10" height="34" fill="#FACC15" rx="1.5" />
    
    <!-- Ponta do lápis (grafite e madeira) -->
    <polygon points="27,44 37,44 32,52" fill="#1E293B" />
    <polygon points="28,44 36,44 32,48" fill="#FDE047" />

    <!-- Borracha na ponta superior -->
    <rect x="27" y="5" width="10" height="7" fill="#F43F5E" rx="1.5" />
    <!-- Cinta metálica da borracha -->
    <rect x="27" y="12" width="10" height="3" fill="#94A3B8" />
  </g>
</svg>
